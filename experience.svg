<svg xmlns="http://www.w3.org/2000/svg" width="860" height="502" viewBox="0 0 860 502" role="img" aria-label="experience: AI Systems Engineering Intern at NRSC · ISRO (2026.05 — 2026.06); Founding Engineer, Backend · SSIP 2.0 grantee at ATLAS AI LABS (2026.04 — 2026.08); Lead Software Engineer · part-time at RADHE ENGINEERING WORKS (2024.09 — now)" fill="none"><title>experience: AI Systems Engineering Intern at NRSC · ISRO (2026.05 — 2026.06); Founding Engineer, Backend · SSIP 2.0 grantee at ATLAS AI LABS (2026.04 — 2026.08); Lead Software Engineer · part-time at RADHE ENGINEERING WORKS (2024.09 — now)</title><style>@font-face{font-family:'kv-mono';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'kv-mono-b';src:url(data:font/woff2;base64,) format('woff2')}.dot{font-family:'kv-dot',ui-monospace,monospace}.mono{font-family:'kv-mono',ui-monospace,monospace}.bold{font-family:'kv-mono-b',ui-monospace,monospace}</style><defs><filter id="glow" filterUnits="userSpaceOnUse" x="-860" y="-502" width="2580" height="1506" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="2.2" result="a"/><feMerge><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="bloom" filterUnits="userSpaceOnUse" x="-860" y="-502" width="2580" height="1506" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="9" result="a"/><feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="b"/><feComponentTransfer in="a" result="a2"><feFuncA type="linear" slope="0.8"/></feComponentTransfer><feMerge><feMergeNode in="a2"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#FFFFFF" opacity=".022"/></pattern><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#1E1813"/></pattern></defs><rect x="0.5" y="0.5" width="859" height="501" rx="14" fill="#110E0C" stroke="#2C2119"/><rect x="0" y="0" width="860" height="502" rx="14" fill="url(#scan)"/><path d="M7 16V7H16 M844 7H853V16 M7 486.0V495.0H16 M844 495.0H853V486.0" stroke="#FF9A3C" stroke-width="1.2" opacity=".55"/><rect x="24" y="21" width="6" height="6" fill="#FF9A3C" filter="url(#glow)"/><text x="38" y="28" class="mono" font-size="10" fill="#9A8471" letter-spacing="1.6">GIT LOG --GRAPH</text><text x="836" y="28" class="mono" font-size="10" fill="#6B5A4B" text-anchor="end" letter-spacing="1.2">3 ROLES</text><path d="M36 60V368.0" stroke="#2C2119" stroke-width="1.5"/><circle cx="36" cy="60" r="4.5" fill="#110E0C" stroke="#FF9A3C" stroke-width="1.5"/><text x="64" y="64" class="bold" font-size="13" fill="#EDE2D6" letter-spacing="1.4">NRSC · ISRO</text><text x="828" y="64" class="mono" font-size="10" fill="#9A8471" text-anchor="end">2026.05 — 2026.06  ·  Hyderabad</text><text x="64" y="85" class="mono" font-size="11.5" fill="#FF9A3C">AI Systems Engineering Intern</text><text x="64" y="107" class="mono" font-size="11.5" fill="#6B5A4B">›</text><text x="80" y="107" class="mono" font-size="11.5" fill="#EDE2D6">Built VYOM, an LLM-driven agentic GIS system (LangGraph, FastAPI, PostGIS) that answers</text><text x="80" y="125.5" class="mono" font-size="11.5" fill="#EDE2D6">natural-language queries over ResourceSat-2/2A imagery.</text><text x="64" y="150" class="mono" font-size="11.5" fill="#6B5A4B">›</text><text x="80" y="150" class="mono" font-size="11.5" fill="#EDE2D6">Automated flood, wildfire, drought and landslide analysis across 6 disaster events and 300+</text><text x="80" y="168.5" class="mono" font-size="11.5" fill="#EDE2D6">satellite scenes via a QGIS plugin.</text><circle cx="36" cy="208.0" r="4.5" fill="#110E0C" stroke="#FF9A3C" stroke-width="1.5"/><text x="64" y="212" class="bold" font-size="13" fill="#EDE2D6" letter-spacing="1.4">ATLAS AI LABS</text><text x="828" y="212" class="mono" font-size="10" fill="#9A8471" text-anchor="end">2026.04 — 2026.08  ·  Ahmedabad</text><text x="64" y="233" class="mono" font-size="11.5" fill="#FF9A3C">Founding Engineer, Backend · SSIP 2.0 grantee</text><text x="64" y="255" class="mono" font-size="11.5" fill="#6B5A4B">›</text><text x="80" y="255" class="mono" font-size="11.5" fill="#EDE2D6">Owned backend architecture end-to-end: service design, data modelling, containerised deploys and</text><text x="80" y="273.5" class="mono" font-size="11.5" fill="#EDE2D6">CI/CD.</text><text x="64" y="298" class="mono" font-size="11.5" fill="#6B5A4B">›</text><text x="80" y="298" class="mono" font-size="11.5" fill="#EDE2D6">Built microservices exposing agentic AI, LLM and deep-learning services behind production REST APIs</text><text x="80" y="316.5" class="mono" font-size="11.5" fill="#EDE2D6">for healthcare and fintech products.</text><circle cx="36" cy="356.0" r="5" fill="#FF9A3C" filter="url(#glow)"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="64" y="360" class="bold" font-size="13" fill="#EDE2D6" letter-spacing="1.4">RADHE ENGINEERING WORKS</text><text x="828" y="360" class="mono" font-size="10" fill="#9A8471" text-anchor="end">2024.09 — now  ·  Ahmedabad</text><text x="64" y="381" class="mono" font-size="11.5" fill="#FF9A3C">Lead Software Engineer · part-time</text><text x="64" y="403" class="mono" font-size="11.5" fill="#6B5A4B">›</text><text x="80" y="403" class="mono" font-size="11.5" fill="#EDE2D6">Sole engineer on a full-stack ERP (inventory, orders, production tracking) that replaced paper-based</text><text x="80" y="421.5" class="mono" font-size="11.5" fill="#EDE2D6">workflows.</text><text x="64" y="446" class="mono" font-size="11.5" fill="#6B5A4B">›</text><text x="80" y="446" class="mono" font-size="11.5" fill="#EDE2D6">Own the whole lifecycle, from requirements and schema design to deploys and maintenance, for a</text><text x="80" y="464.5" class="mono" font-size="11.5" fill="#EDE2D6">system 20+ employees use daily.</text></svg>